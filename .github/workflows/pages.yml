name: Deploy WebGPU Citrus Jelly
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate self-contained HTML and JavaScript
        run: |
          test -s index.html
          grep -q 'navigator.gpu' index.html
          grep -q 'function delaunay' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S)
          assert len(scripts) == 6, f"Expected five WGSL source tags and one JavaScript tag, got {len(scripts)}"
          assert 'src=' not in html and '<link ' not in html, "Demo should not import dependencies"
          Path("/tmp/citrus-jelly-app.js").write_text(scripts[-1])
          print("Self-contained HTML: passed")
          PY
          node --check /tmp/citrus-jelly-app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
