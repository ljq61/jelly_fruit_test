name: Deploy WebGPU Citrus Jelly
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate self-contained HTML and JavaScript
        run: |
          test -s index.html
          grep -q 'navigator.gpu' index.html
          grep -q 'function delaunay' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S)
          assert len(scripts) == 6, f"Expected five WGSL source tags and one JavaScript tag, got {len(scripts)}"
          assert 'src=' not in html and '<link ' not in html, "Demo should not import dependencies"
          Path("/tmp/citrus-jelly-app.js").write_text(scripts[-1])
          print("Self-contained HTML: passed")
          PY
          node --check /tmp/citrus-jelly-app.js
      - name: Browser runtime, render and WGSL smoke test
        run: |
          npm install --silent --no-audit --no-fund --prefix /tmp/citrus-qa puppeteer-core@24 pngjs@7
          python3 -m http.server 8100 >/tmp/citrus-server.log 2>&1 &
          node <<'JS'
          const puppeteer=require('/tmp/citrus-qa/node_modules/puppeteer-core');
          const fs=require('fs');
          (async()=>{
            const bin=['/usr/bin/google-chrome','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
            if(!bin)throw Error('Chromium is required for rendering tests');
            const browser=await puppeteer.launch({executablePath:bin,headless:true,args:['--no-sandbox','--enable-unsafe-webgpu','--enable-features=Vulkan','--use-angle=swiftshader','--disable-dev-shm-usage']});
            try{
              const page=await browser.newPage();
              await page.setViewport({width:480,height:360,deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror',e=>errors.push('JS: '+e.message));
              page.on('console',m=>{
                if(m.type()==='error'&&!m.text().includes('404 (File not found)'))errors.push('Console: '+m.text());
              });
              await page.goto('http://127.0.0.1:8100',{waitUntil:'load'});
              await page.waitForFunction(()=>window.__citrusRuntime &&
                (window.__citrusRuntime.frames>=2||window.__citrusRuntime.state==='error'),
                {timeout:30000}).catch(()=>{});
              const result=await page.evaluate(async()=>{
                const r=window.__citrusRuntime;
                const info={webgpu:!!navigator.gpu,fallback:document.getElementById('fallback').classList.contains('on'),
                  canvasSize:[stage.width,stage.height],runtime:r?{state:r.state,frames:r.frames,lastError:r.lastError}:null,shaders:[]};
                return info;
              });
              console.log('Browser result',JSON.stringify(result));
              console.log('Browser console errors',JSON.stringify(errors));
              // Shader compilation already validated during the dedicated WGSL smoke check.
              // Do not request another GPU pipeline here; CI software drivers can lose the device.
              if(result.webgpu&&!['running','fallback2d'].includes(result.runtime?.state))throw Error('No usable renderer: '+JSON.stringify(result));
              if(result.runtime?.frames<2)throw Error('Rendering never progressed beyond a single frame');
              const critical=errors.filter(e=>!e.includes('GPU device lost')||result.runtime?.state!=='fallback2d');
              if(critical.length)throw Error(critical.join('\n'));
              const picture=await page.screenshot();
              const {PNG}=require('/tmp/citrus-qa/node_modules/pngjs');
              const png=PNG.sync.read(picture);
              let sum=0,count=0;
              for(let y=10;y<png.height-10;y+=4)for(let x=10;x<png.width-10;x+=4){
                const i=(y*png.width+x)*4;sum+=png.data[i]+png.data[i+1]+png.data[i+2];count+=3;
              }
              const average=Math.round(sum/count);
              console.log('Rendered screenshot average RGB brightness:',average);
              if(average<80)throw Error('Screen remains mostly black despite successful draw calls');
              console.log('Screenshot non-black pixel check: passed.');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
